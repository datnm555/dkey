name: dkey
options:
  bundleIdPrefix: com.datnm555
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  dkey:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Support
        includes:
          - "Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datnm555.dkey
        PRODUCT_NAME: dkey
        INFOPLIST_FILE: Sources/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Support/dkey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: Cocoa.framework
      - sdk: ServiceManagement.framework

  dkeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SmokeTests
    dependencies:
      - target: dkey
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dkey.app/Contents/MacOS/dkey"
